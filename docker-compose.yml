# Banco local para desenvolvimento: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: cloudmarket-db
    environment:
      POSTGRES_DB: cloudmarket
      POSTGRES_USER: cloudmarket
      POSTGRES_PASSWORD: cloudmarket
    ports:
      - "5432:5432"
    volumes:
      - cloudmarket-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudmarket"]
      interval: 5s
      retries: 10

volumes:
  cloudmarket-data:
